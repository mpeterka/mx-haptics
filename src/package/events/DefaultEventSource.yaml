# Every reaction has three intensity variants; the plugin raises the one chosen in the settings window.
events:
  - name: windowBorder_weak
    displayName: Window border (low)
    description: The pointer moved from one window to another
  - name: windowBorder_medium
    displayName: Window border (medium)
    description: The pointer moved from one window to another
  - name: windowBorder_strong
    displayName: Window border (high)
    description: The pointer moved from one window to another
  - name: controlHover_weak
    displayName: Button hover (low)
    description: The pointer entered a button, link, tab or menu item
  - name: controlHover_medium
    displayName: Button hover (medium)
    description: The pointer entered a button, link, tab or menu item
  - name: controlHover_strong
    displayName: Button hover (high)
    description: The pointer entered a button, link, tab or menu item
  - name: screenEdge_weak
    displayName: Screen edge (low)
    description: The pointer hit the edge of the desktop
  - name: screenEdge_medium
    displayName: Screen edge (medium)
    description: The pointer hit the edge of the desktop
  - name: screenEdge_strong
    displayName: Screen edge (high)
    description: The pointer hit the edge of the desktop
  - name: click_weak
    displayName: Click (low)
    description: Left or right click on a button, link or taskbar icon
  - name: click_medium
    displayName: Click (medium)
    description: Left or right click on a button, link or taskbar icon
  - name: click_strong
    displayName: Click (high)
    description: Left or right click on a button, link or taskbar icon
